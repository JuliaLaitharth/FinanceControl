[build]
# Railway detecta o Dockerfile automaticamente em ./backend
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy && node dist/main'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"

  [services.build]
  dockerfilePath = "backend/Dockerfile"
  buildContext = "backend"

  [services.deploy]
  startCommand = "sh -c 'npx prisma migrate deploy && node dist/main'"

[[services]]
name = "postgres"
image = "postgres:16"

  [services.variables]
  POSTGRES_USER = "finuser"
  POSTGRES_DB = "assistente"

[[services]]
name = "redis"
image = "redis:7"
