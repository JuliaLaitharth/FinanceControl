services:
  - type: web
    name: financecontrol-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: financecontrol-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: financecontrol-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: financecontrol-redis
          type: redis
          property: port
      # Segredos: defina no painel do Render → Environment
      - key: JWT_SECRET
        sync: false
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: PLUGGY_WEBHOOK_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: ALEXA_CLIENT_ID
        sync: false
      - key: ALEXA_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: API_BASE_URL
        sync: false

databases:
  - name: financecontrol-db
    databaseName: assistente
    user: finuser
    plan: free

  - name: financecontrol-redis
    type: redis
    plan: free
